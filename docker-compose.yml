version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora_password
      POSTGRES_DB: nexora
    ports:
      - "5432:5432"
    volumes:
      - nexora_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nexora_redis_data:/data

  nexora:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_URL: postgresql://nexora:nexora_password@postgres:5432/nexora?schema=public
      REDIS_URL: redis://redis:6379
      DATABASE_PATH: /app/data/nexora.db
      UPLOADS_DIR: /app/uploads/encrypted
    volumes:
      - nexora_app_data:/app/data
      - nexora_uploads:/app/uploads
    depends_on:
      - postgres
      - redis

volumes:
  nexora_pg_data:
  nexora_redis_data:
  nexora_app_data:
  nexora_uploads:
